<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热轧复合板智能设计系统 - 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #0f2027 0%, #203a43 40%, #2c5364 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 16px; padding: 48px 40px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .card h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
  .card p { color: #666; font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; font-weight: 500; }
  .field input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; outline: none; }
  .field input:focus { border-color: #2c5364; }
  .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #2c5364, #203a43); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(44,83,100,0.4); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .error { color: #d32f2f; font-size: 13px; margin-top: 12px; text-align: center; min-height: 20px; }
</style>
</head>
<body>
<div class="card">
  <h1>热轧复合板智能设计系统</h1>
  <p>请输入访问密码</p>
  <form id="loginForm">
    <div class="field">
      <label>访问密码</label>
      <input type="password" id="password" placeholder="请输入密码" autofocus>
    </div>
    <button type="submit" class="btn" id="loginBtn">登 录</button>
    <div class="error" id="error"></div>
  </form>
</div>

<script>
const API = '';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const error = document.getElementById('error');
  btn.disabled = true;
  btn.textContent = '登录中...';
  error.textContent = '';

  try {
    const resp = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    if (!resp.ok) {
      const data = await resp.json();
      throw new Error(data.error || '登录失败');
    }
    const { token } = await resp.json();
    localStorage.setItem('slab_token', token);
    window.location.href = '/';
  } catch (e) {
    error.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});

// Auto-redirect if already logged in
if (localStorage.getItem('slab_token')) {
  window.location.href = '/';
}
</script>
</body>
</html>
